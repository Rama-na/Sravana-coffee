<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#031B46" />

    <title>Saravana Coffee — Authentic Filter Coffee Since 1995</title>
    <meta
      name="description"
      content="Authentic South Indian filter coffee, freshly roasted and ground in Chennai since 1995."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Saravana Coffee — Authentic Filter Coffee Since 1995" />
    <meta
      property="og:description"
      content="Authentic South Indian filter coffee, freshly roasted and ground in Chennai since 1995."
    />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Saravana Coffee — Authentic Filter Coffee Since 1995" />
    <meta
      name="twitter:description"
      content="Authentic South Indian filter coffee, freshly roasted and ground in Chennai since 1995."
    />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />

    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/manrope-var.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%BASE_URL%fonts/cormorant-garamond-var.woff2"
      crossorigin
    />

    <!--
      Paints the very first frame in brand blue so there is never a white
      flash before the stylesheet lands. It must read the live variable:
      a hard-coded colour here is unlayered CSS and would outrank the
      themed rule in @layer base for the whole life of the page.
    -->
    <style>
      :root { --page-bg: #031b46; }
      html { background-color: var(--page-bg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
